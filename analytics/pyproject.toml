[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudpulse-analytics"
version = "0.2.0"
description = "Simulated cloud data generation, forecasting, anomaly detection and FinOps analysis for CloudPulse"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.5"]

[tool.setuptools]
packages = ["cloudpulse_analytics"]
