name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check analytics backend

  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/requirements.txt
      - run: pip install -r analytics/requirements.txt
      - name: Analytics tests
        working-directory: analytics
        run: python -m pytest -v --junitxml=../analytics-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-test-results
          path: analytics-results.xml

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, sqlite]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloudpulse
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: cloudpulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloudpulse"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://cloudpulse:ci-only-password@localhost:5432/cloudpulse_test' || 'sqlite://' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install ./analytics -r backend/requirements-dev.txt pypdf
      - name: Backend tests (${{ matrix.database }})
        working-directory: backend
        run: python -m pytest -v -rs --junitxml=../backend-${{ matrix.database }}-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ matrix.database }}-test-results
          path: backend-${{ matrix.database }}-results.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install ../analytics -r ../backend/requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests against the real API
        run: |
          set -euo pipefail
          export E2E_ADMIN_EMAIL=admin@cloudpulse.test E2E_VIEWER_EMAIL=viewer@cloudpulse.test E2E_DEMO=1
          export E2E_ADMIN_PASSWORD="Ci$(openssl rand -hex 16)" E2E_VIEWER_PASSWORD="Ci$(openssl rand -hex 16)"
          (cd ../backend && JWT_SECRET="$(openssl rand -hex 32)" DATABASE_URL=sqlite:////tmp/e2e.db \
            ADMIN_EMAIL="$E2E_ADMIN_EMAIL" ADMIN_PASSWORD="$E2E_ADMIN_PASSWORD" \
            DEMO_USER_EMAIL="$E2E_VIEWER_EMAIL" DEMO_USER_PASSWORD="$E2E_VIEWER_PASSWORD" DEMO_USER_ROLE=viewer DEMO_LOGIN_ENABLED=true \
            nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS localhost:8000/readyz && break || sleep 2; done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report

  platform-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests against the API schemas
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          kubectl kustomize infrastructure/k8s/overlays/local | ./kubeconform -strict -summary -kubernetes-version 1.31.0
      - name: Check Prometheus configuration and test alert rules
        run: |
          set -euo pipefail
          promtool() { docker run --rm -v "$PWD/infrastructure/monitoring:/m:ro" -w /m --entrypoint promtool prom/prometheus:v2.55.1 "$@"; }
          promtool check rules rules/cloudpulse.yml
          promtool check config --syntax-only prometheus.k8s.yml prometheus.compose.yml
          promtool test rules rules.test.yml

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Plan tests with a mocked provider (no AWS account, nothing created)
        run: terraform test

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to a kind cluster and verify behavior
        run: infrastructure/scripts/verify-kind.sh
      - name: Cluster state
        if: always()
        run: |
          kubectl -n cloudpulse get pods -o wide || true
          kubectl -n cloudpulse get events --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n cloudpulse logs deployment/api --tail=50 || true

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack with monitoring
        run: |
          set -euo pipefail
          cp .env.example .env
          ADMIN_PASSWORD="Ci$(openssl rand -hex 16)"; echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          GRAFANA_PASSWORD="$(openssl rand -hex 16)"; echo "GRAFANA_PASSWORD=$GRAFANA_PASSWORD" >> "$GITHUB_ENV"
          sed -i "s/^ENVIRONMENT=.*/ENVIRONMENT=production/; s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/; s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^ADMIN_EMAIL=.*/ADMIN_EMAIL=ci@cloudpulse.test/; s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=$ADMIN_PASSWORD/; s/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=$GRAFANA_PASSWORD/" .env
          docker compose --profile monitoring up -d --build --wait --wait-timeout 300
      - name: Check the stack through the web container
        run: |
          set -euo pipefail
          curl -fsSI localhost:8080/ | grep -qi content-security-policy
          TOKEN=$(curl -fsS -X POST localhost:8080/api/v1/auth/login -H 'content-type: application/json' \
            -d "{\"email\":\"ci@cloudpulse.test\",\"password\":\"$ADMIN_PASSWORD\"}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -fsS localhost:8080/api/v1/dashboard/executive -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json;assert json.load(sys.stdin)["data_source"]=="SIMULATED"'
          for i in $(seq 1 30); do
            curl -fsS 'localhost:9090/api/v1/query?query=cloudpulse_fleet_health_score' | grep -q SIMULATED && break || sleep 3
          done
          curl -fsS 'localhost:9090/api/v1/query?query=cloudpulse_fleet_health_score' | grep -q SIMULATED
          curl -fsS -u "admin:$GRAFANA_PASSWORD" localhost:3000/api/dashboards/uid/cloudpulse-overview | grep -q cloudpulse-overview
      - name: Container logs
        if: always()
        run: docker compose --profile monitoring logs --tail=40 || true

  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/Dockerfile -t cloudpulse-api:ci .
      - name: Smoke test the container
        run: |
          set -euo pipefail
          ADMIN_PASSWORD="$(openssl rand -hex 16)"
          docker run -d --name api -p 8000:8000 \
            -e ENVIRONMENT=production -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e DATABASE_URL=sqlite:////tmp/cloudpulse.db \
            -e ADMIN_EMAIL=ci@cloudpulse.test -e ADMIN_PASSWORD="$ADMIN_PASSWORD" cloudpulse-api:ci
          for i in $(seq 1 40); do curl -fsS localhost:8000/readyz && break || sleep 2; done
          TOKEN=$(curl -fsS -X POST localhost:8000/api/v1/auth/login -H 'content-type: application/json' \
            -d "{\"email\":\"ci@cloudpulse.test\",\"password\":\"$ADMIN_PASSWORD\"}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -fsS localhost:8000/api/v1/dashboard/executive -H "Authorization: Bearer $TOKEN" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print("health", d["health"]["health_score"], "spend", d["costs"]["last_30d_usd"], d["data_source"])'
          curl -fsS -o report.pdf localhost:8000/api/v1/reports/executive.pdf -H "Authorization: Bearer $TOKEN"
          head -c 4 report.pdf | grep -q '%PDF'
          docker inspect --format '{{.State.Health.Status}}' api
      - name: Container logs
        if: always()
        run: docker logs api || true
      - name: Build and smoke-test the single-service demo image
        run: |
          set -euo pipefail
          docker build -f Dockerfile.render -t cloudpulse-demo:ci .
          docker run -d --name demo -p 8001:8000 -e ENVIRONMENT=production -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e DATABASE_URL=sqlite:////tmp/demo.db -e METRICS_TOKEN="$(openssl rand -hex 16)" cloudpulse-demo:ci
          for i in $(seq 1 40); do curl -fsS localhost:8001/readyz && break || sleep 2; done
          curl -fsS localhost:8001/costs | grep -q '<div id="root">'
          curl -fsSI localhost:8001/ | grep -qi content-security-policy
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8001/metrics)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8001/api/v1/nope)" = 404
