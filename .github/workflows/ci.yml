name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check analytics backend

  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/requirements.txt
      - run: pip install -r analytics/requirements.txt
      - name: Analytics tests
        working-directory: analytics
        run: python -m pytest -v --junitxml=../analytics-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-test-results
          path: analytics-results.xml

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, sqlite]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloudpulse
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: cloudpulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloudpulse"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://cloudpulse:ci-only-password@localhost:5432/cloudpulse_test' || 'sqlite://' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install ./analytics -r backend/requirements-dev.txt pypdf
      - name: Backend tests (${{ matrix.database }})
        working-directory: backend
        run: python -m pytest -v -rs --junitxml=../backend-${{ matrix.database }}-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ matrix.database }}-test-results
          path: backend-${{ matrix.database }}-results.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install ../analytics -r ../backend/requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests against the real API
        run: |
          set -euo pipefail
          export E2E_ADMIN_EMAIL=admin@cloudpulse.test E2E_VIEWER_EMAIL=viewer@cloudpulse.test
          export E2E_ADMIN_PASSWORD="Ci$(openssl rand -hex 16)" E2E_VIEWER_PASSWORD="Ci$(openssl rand -hex 16)"
          (cd ../backend && JWT_SECRET="$(openssl rand -hex 32)" DATABASE_URL=sqlite:////tmp/e2e.db \
            ADMIN_EMAIL="$E2E_ADMIN_EMAIL" ADMIN_PASSWORD="$E2E_ADMIN_PASSWORD" \
            DEMO_USER_EMAIL="$E2E_VIEWER_EMAIL" DEMO_USER_PASSWORD="$E2E_VIEWER_PASSWORD" DEMO_USER_ROLE=viewer \
            nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS localhost:8000/readyz && break || sleep 2; done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report

  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/Dockerfile -t cloudpulse-api:ci .
      - name: Smoke test the container
        run: |
          set -euo pipefail
          ADMIN_PASSWORD="$(openssl rand -hex 16)"
          docker run -d --name api -p 8000:8000 \
            -e ENVIRONMENT=production -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e DATABASE_URL=sqlite:////tmp/cloudpulse.db \
            -e ADMIN_EMAIL=ci@cloudpulse.test -e ADMIN_PASSWORD="$ADMIN_PASSWORD" cloudpulse-api:ci
          for i in $(seq 1 40); do curl -fsS localhost:8000/readyz && break || sleep 2; done
          TOKEN=$(curl -fsS -X POST localhost:8000/api/v1/auth/login -H 'content-type: application/json' \
            -d "{\"email\":\"ci@cloudpulse.test\",\"password\":\"$ADMIN_PASSWORD\"}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -fsS localhost:8000/api/v1/dashboard/executive -H "Authorization: Bearer $TOKEN" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print("health", d["health"]["health_score"], "spend", d["costs"]["last_30d_usd"], d["data_source"])'
          curl -fsS -o report.pdf localhost:8000/api/v1/reports/executive.pdf -H "Authorization: Bearer $TOKEN"
          head -c 4 report.pdf | grep -q '%PDF'
          docker inspect --format '{{.State.Health.Status}}' api
      - name: Container logs
        if: always()
        run: docker logs api || true
