apiVersion: v1
kind: Secret
metadata:
  name: cloudpulse-secrets
  namespace: cloudpulse
type: Opaque
stringData:
  JWT_SECRET: ""
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  POSTGRES_DB: ""
  DATABASE_URL: ""         # postgresql+psycopg://USER:PASSWORD@postgres:5432/DB
  ADMIN_EMAIL: ""
  ADMIN_PASSWORD: ""
  GRAFANA_ADMIN_PASSWORD: ""
  # ANTHROPIC_API_KEY: ""  # optional: enables AI mode for the advisor
